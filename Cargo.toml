[package]
name = "ntex-mqtt"
version = "9.0.0-beta.0"
authors = ["ntex contributors <team@ntex.rs>"]
description = "Client and Server framework for MQTT v5 and v3.1.1 protocols"
documentation = "https://docs.rs/ntex-mqtt"
repository = "https://github.com/ntex-rs/ntex-mqtt.git"
categories = ["network-programming"]
keywords = ["MQTT", "IoT", "messaging"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.95"

[package.metadata.docs.rs]
features = ["ntex-net/tokio"]

[dependencies]
ntex-bytes = "1.9.0"
ntex-codec = "1.2"
ntex-error = "2.5"
ntex-io = "4.0.0-beta.0"
ntex-net = "4.0.0-beta.0"
ntex-service = "5.0.0-beta.4"
ntex-router = "1"
ntex-rt = "3.17"
ntex-util = "4.0.0-beta.3"

bitflags = "2"
log = "0.4"
pin-project-lite = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
ntex = { version = "4.0.0-beta.2", features = ["openssl"] }
ntex-tls = "4.0.0-beta.0"
ntex-server = "4.0.0-beta.1"

rand = "0.10"
env_logger = "0.11"
openssl = "0.10"
oneshot = { version = "0.2.1", features = ["std", "async"] }
test-case = "3.2"

[patch.crates-io]
ntex = { path = "../../ntex/ntex" }
ntex-util = { path = "../../ntex/ntex-util" }
ntex-service = { path = "../../ntex/ntex-service" }
ntex-h2 = { path = "../ntex-h2" }
