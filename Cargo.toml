[package]
name = "ntex-mqtt"
version = "9.2.1"
authors = ["ntex contributors <team@ntex.rs>"]
description = "Client and Server framework for MQTT v5 and v3.1.1 protocols"
documentation = "https://docs.rs/ntex-mqtt"
repository = "https://github.com/ntex-rs/ntex-mqtt.git"
categories = ["network-programming"]
keywords = ["MQTT", "IoT", "messaging"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.97"

[package.metadata.docs.rs]
features = ["ntex-net/tokio"]

[dependencies]
ntex-bytes = "1.11"
ntex-codec = "2.0"
ntex-error = "3.0"
ntex-io = "4.3"
ntex-net = "4.3"
ntex-service = "5.2"
ntex-router = "2.1"
ntex-rt = "4"
ntex-util = "4.3"

bitflags = "2"
log = "0.4"
pin-project-lite = "0.2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
ntex = { version = "4.0.0-beta.18", features = ["openssl"] }
ntex-tls = "4.3"
ntex-server = "4.2"

rand = "0.10"
env_logger = "0.11"
openssl = "0.10"
oneshot = { version = "0.2.1", features = ["std", "async"] }
test-case = "3.2"
serde_json = "1"
